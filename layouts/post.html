<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | المدونة العربية للثقافة والإعلام</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 🔹 شريط علوي بسيط -->
  <header class="post-header">
    <div class="container">
      <a href="../index.html" class="logo">المدونة العربية للثقافة والإعلام</a>
      <nav class="nav">
        <a href="../index.html">الرئيسية</a>
        <a href="#">عن الكاتب</a>
        <a href="#">تواصل معنا</a>
      </nav>
    </div>
  </header>

  <!-- 🟢 منطقة المقال -->
  <main class="post-container">
    <article class="post">
      <h1 class="post-title">{{ page.title }}</h1>
      <p class="post-meta">بقلم: {{ page.author }} | <span>{{ page.date }}</span></p>

      <div class="post-content">
        {{ content }}
      </div>

      <div class="post-footer">
        <p>شارك المقال عبر وسائل التواصل الاجتماعي:</p>
        <div class="social-icons">
          <a href="#"><img src="../assets/icons/facebook.svg" alt="Facebook"></a>
          <a href="#"><img src="../assets/icons/twitter.svg" alt="Twitter"></a>
          <a href="#"><img src="../assets/icons/linkedin.svg" alt="LinkedIn"></a>
        </div>
      </div>
    </article>
  </main>

  <!-- ⚫ Footer -->
  <footer class="footer">
    <p>منابر فكرية ورؤى إعلامية... بروح عربية أصيلة.</p>
    <p>© 2025 جميع الحقوق محفوظة – د. طراد علي بن سرحان الرويس</p>
  </footer>

</body>
</html>
