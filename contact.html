<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اتصل بنا | المدونة العربية للثقافة والإعلام</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
  <header>
    <a href="index.html" class="logo">المدونة العربية للثقافة والإعلام</a>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="about.html">عن المدونة</a>
      <a href="contact.html" class="active">اتصل بنا</a>
    </nav>
  </header>

  <main class="contact-page">
    <section class="contact-hero">
      <h1>اتصل بنا</h1>
      <p>نرحب بتواصلكم واقتراحاتكم وآرائكم البنّاءة.</p>
    </section>

    <section class="contact-form-section">
      <form action="https://formspree.io/f/your-form-id" method="POST" class="contact-form">
        <label for="name">الاسم الكامل:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" name="_replyto" required />

        <label for="message">رسالتك:</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">إرسال الرسالة</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 المدونة العربية للثقافة والإعلام - إشراف د. طراد الرويس</p>
  </footer>
</body>
</html>
