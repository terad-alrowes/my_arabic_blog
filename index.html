<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المدونة العربية للثقافة والإعلام</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>المدونة العربية للثقافة والإعلام</h1>
    <p class="subtitle">منبر للفكر العربي.. نحو وعي ونهضة</p>
  </header>

  <main class="post-list">
    {% for post in site.posts %}
      <article class="post-card">
        <a href="{{ post.url }}">
          <img src="{{ post.image }}" alt="{{ post.title }}">
        </a>
        <div class="post-content">
          <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
          <p class="meta">✍ {{ post.author }} | {{ post.date | date: "%Y-%m-%d" }}</p>
          <p class="excerpt">{{ post.description }}</p>
          <a href="{{ post.url }}" class="read-more">اقرأ المزيد →</a>
        </div>
      </article>
    {% endfor %}
  </main>

  <footer class="site-footer">
    <p>© 2025 المدونة العربية للثقافة والإعلام | بإشراف د. طراد الرويس</p>
  </footer>
</body>
</html>
